name: OpenEDDI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'tests/**', 'tools/**', 'CMakeLists.txt', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libgl1-mesa-dev xvfb xauth
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          arch: x64
      - name: Configure
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then args+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${args[@]}"
      - name: Build
        run: cmake --build build --target OpenEDDI legacy_tests data_tests graphics_tests transaction_failure_tests mcp_tests --parallel 3
      - name: Test
        run: ctest --test-dir build -R "^openeddi_" --output-on-failure --output-junit tests.xml
      - name: Native GUI
        shell: bash
        run: |
          binary=build/OpenEDDI
          if [ "$RUNNER_OS" = Windows ]; then binary=build/OpenEDDI.exe; export OPENBMH_RML_DRIVER=warp; fi
          echo '{"language":"de","theme":"midnight","mcp_enabled":false}' > build/qa-options.json
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          "${display[@]}" "$binary" --demo --settings build/qa-options.json --screenshot build/native.png --quit-after-ms 1200
          test -s build/native.png
      - name: Package
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = Linux ]; then args+=(--source); fi
          python3 tools/package.py --build build --out dist --platform ${{ matrix.platform }} "${args[@]}"
      - name: Test extracted application package
        run: python3 tools/package_smoke.py --dist dist --platform ${{ matrix.platform }} --output build/package-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OpenEDDI-${{ matrix.platform }}
          path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checks-${{ matrix.platform }}
          path: |
            build/tests.xml
            build/native.png
            build/package-check/**
